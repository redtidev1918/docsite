# docsite: 管理文件，由 docsite 模板维护。
# 导航契约 CI gate：对全账号受管仓库运行 docsite.py navcheck --all。
# 全绿 = 所有受管仓库满足 canonical 导航结构约束；结构性例外必须由
# 仓库通过 .docsite.json 显式声明（见 README「导航与信息架构」）。

name: Navigation contract check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # 每周一 03:00 UTC
  push:
    branches:
      - main
    paths:
      - 'docsite.py'
      - 'template/**'
      - '.github/workflows/navcheck.yml'

permissions:
  contents: read

concurrency:
  group: "navcheck"
  cancel-in-progress: false

jobs:
  navcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docsite
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Clone managed repositories
        env:
          # 优先使用仅授权受检仓库 contents:read 的专用 token。
          # 兼容现有账号级 token；单仓库 GITHUB_TOKEN 无法读取其它私有仓库。
          GH_TOKEN: ${{ secrets.NAVCHECK_REPOS_TOKEN || secrets.PROFILE_REPO_TOKEN || github.token }}
        run: |
          gh auth setup-git --hostname github.com
          mkdir -p repos
          for r in PixivFlow pixiv-token-getter pixivflow-telepost-deploy TelePost \
                   DAKit TelePress pixivflow-webui ParaNote ludum Graf \
                   DeviantDrop deviantart-downloader DAViewer NekoTime releasegraph \
                   docsite; do
            echo "Checking out redtidev1918/$r"
            git clone --quiet --depth 1 "https://github.com/redtidev1918/$r" "repos/$r"
          done

      - name: Run navcheck
        run: python3 docsite.py navcheck --all repos
